<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクターパーク QRカメラ</title><style>body{font:17px system-ui;background:#fff0f7;color:#69496c;max-width:480px;margin:auto;padding:18px}section{background:white;border-radius:20px;padding:16px}button{font:inherit;background:white;border:1px solid #d9a6ce;border-radius:14px;padding:12px;margin:5px}#reader{width:100%}</style></head><body><h1>🌈 QRコードをさがそう！</h1><section><button id="start">📷 カメラを起動</button><button id="back">ゲームに戻る</button><p id="status" aria-live="polite">カメラを起動して、QRコードを映してね。</p><div id="reader"></div></section><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const $=id=>document.getElementById(id);let scanner=null,busy=false,done=false;let target=null;try{const u=new URL(new URLSearchParams(location.hash.slice(1)).get('return'));if(u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname)){u.search='';u.hash='';target=u;}}catch(e){}if(!target)$('back').hidden=true;
async function stop(){if(scanner){try{if(scanner.isScanning)await scanner.stop();scanner.clear()}catch(e){}scanner=null;}}
$('back').onclick=async()=>{done=true;await stop();if(target)location.replace(target.href);};
$('start').onclick=async()=>{if(busy||done)return;busy=true;$('start').disabled=true;try{if(typeof Html5Qrcode==='undefined')throw Error('QRライブラリを読み込めません');scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:200,height:200}},async value=>{if(done)return;const m=/^OUCHI-PARK-SPOT-(10|[1-9])$/.exec(value);if(!m){$('status').textContent='キャラクターパークのQRコードを映してね。';return;}done=true;await stop();$('status').textContent='場所 '+m[1]+' のQRコードを読み取りました！';if(target){target.searchParams.set('spot',m[1]);location.replace(target.href);}else $('start').textContent='読み取り成功！';},()=>{});if(!done)$('status').textContent='QRコードを枠に合わせてね。';}catch(e){await stop();$('status').textContent='カメラ起動失敗：'+String(e?.message||e);$('start').disabled=false;}finally{busy=false;}};
</script></body></html>
